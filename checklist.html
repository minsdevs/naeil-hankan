<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>같은 작업 일반 체크리스트</title><link rel="stylesheet" href="style.css"></head><body><header><a href="index.html" class="brand">내 일 한 칸</a></header><main><section class="intro"><p class="eyebrow">비교용 · 같은 작업과 같은 5단계</p><h1>서류 6장 나누기</h1><p>연습용 종이만 사용해요. 이번 연습의 “이번 달”은 10월이에요.</p><label class="confirm"><input type="checkbox">연습용 서류 6장과 이름표가 붙은 두 칸을 놓아요.</label><label class="confirm"><input type="checkbox">맨 위 종이 한 장을 집어, “월” 앞의 숫자를 찾아요.</label><label class="confirm"><input type="checkbox">10월이면 “이번 달”, 다른 월이면 “다른 달” 칸에 넣어요.</label><label class="confirm"><input type="checkbox">남은 종이도 날짜를 보고, 맞는 칸에 한 장씩 넣어요.</label><label class="confirm"><input type="checkbox">두 칸의 종이를 세고, 날짜와 이름표를 다시 비교해요.</label><p>모르겠거나 준비물이 없으면 담당자에게 물어봐요.</p><a href="index.html">한 단계씩 보기로 돌아가기</a></section></main></body></html>
